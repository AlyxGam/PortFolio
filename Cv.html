<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./Doc/LogoSite.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/CvCss.css">
    <title>CV de ROBERT Alyx</title>
    <style>
        .cv-container {
            position: relative;
        }
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10; /* Assurez-vous que le bouton est au-dessus de l'iframe */
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-gradient">
            <div class="container">
                <a class="navbar-brand" href="#">ROBERT Alyx - Développeur Web</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="Accueil.html">Accueil</a></li>
                        <li class="nav-item"><a class="nav-link" href="Aps.html">APS</a></li>
                        <li class="nav-item"><a class="nav-link" href="Stages.html">Stages</a></li>
                        <li class="nav-item"><a class="nav-link" href="Cv.html">CV</a></li>
                        <li class="nav-item"><a class="nav-link" href="Veille.html">Veille</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <h1>Mon CV</h1>

        <div class="ap-frame">
            <div class="cv-container">
                <iframe id="cv-iframe" src="./Doc/CvRa2024_25.pdf" width="100%" height="600px">
                    Ce navigateur ne supporte pas l'affichage des PDFs. <a href="./Doc/CvRa2024.pdf">Téléchargez le PDF</a>.
                </iframe>
                <!-- Bouton pour passer en plein écran -->
                <button id="fullscreen-btn" class="btn btn-primary fullscreen-btn">Plein écran</button>
            </div>
            <div class="text-center mt-3">
                <a href="./Doc/CvRa2024.pdf" download class="download-btn">Télécharger mon CV</a>
            </div>
        </div>
    </main>

    <footer>
        <p>2024 Alyx ROBERT Tous droits réservés.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('fullscreen-btn').addEventListener('click', function() {
            var iframe = document.getElementById('cv-iframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.mozRequestFullScreen) { // Firefox
                iframe.mozRequestFullScreen();
            } else if (iframe.webkitRequestFullscreen) { // Chrome, Safari and Opera
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) { // IE/Edge
                iframe.msRequestFullscreen();
            }
        });
    </script>
</body>
</html>
